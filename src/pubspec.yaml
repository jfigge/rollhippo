name: rollhippo

# A dice tray, simulated in the phone's own frame of reference: the walls never
# move and the acceleration field inside them comes straight off the
# accelerometer. README.md explains why that one decision is the whole thing.
description: "Roll Hippo — a dice tray with the physics done honestly."

# An app, not a package. Nothing here is meant for pub.dev, and this line is
# what stops `flutter pub publish` from being able to try.
publish_to: "none"

# The version people read, and after the `+` the build number the stores count
# by. App Store Connect refuses a build number it has already accepted, so a
# second upload means bumping the `+N` and rebuilding — see `make upload`. Play
# is the same arrangement under the name versionCode, which Gradle takes from
# here rather than from anything in android/.
version: 1.0.0+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Accelerometer and gyroscope. The tray reads both: the accelerometer is the
  # effective gravity field inside the box, and the gyroscope supplies the
  # rotational pseudo-forces that turn a wrist flick into a tumble.
  #
  # 7 rather than 6 for the Android build and nothing else: 7.1.0 is where the
  # plugin stopped applying the Kotlin Gradle Plugin unconditionally, which is
  # what Flutter now warns about on its way to failing the build over it. The
  # Dart side is identical — same three streams, same samplingPeriod — and 7.0's
  # own breaking change was a floor on AGP and Gradle that this project is
  # already well above.
  sensors_plus: ^7.1.0

  # Vector3, Quaternion and Matrix3 for the rigid-body maths. Flutter already
  # ships it; naming it here is just honesty about a direct import.
  vector_math: ^2.1.4

  # Draws the Share sheet's QR code. Pure Dart on top of `qr` — no platform
  # code, so the harness renders the same square the phone does.
  qr_flutter: ^4.1.0

  # Reads one back. This is the dependency with teeth: it is the camera, so it
  # is the reason `ios/Runner/Info.plist` carries NSCameraUsageDescription and
  # the reason macOS is built against 10.15. See lib/app/scan_screen.dart.
  #
  # It is no longer why iOS is at 15.0, though it once was. This package has
  # since dropped its own floor to 12.0, and the highest any plugin here asks
  # for is 13.0 — so what holds iOS at 15.0 now is Apple, which warns on an
  # upload below it and refuses one from Spring 2027. See ios/Podfile.
  mobile_scanner: ^7.4.0

  # Everything the app is asked to remember between launches: the haptic
  # calibration, the motion switch, and every saved profile. The calibration is
  # the one that was earned rather than chosen — the number was arrived at by
  # shaking the phone with the slider open, and asking for it again on every
  # launch would waste that.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Encodes what `tool/` renders: the roll GIF, the card sheets, the app icon
  # at every size the three platforms ask for, and the store screenshots.
  # Nothing under `lib/` imports it — it is a build-time tool rather than part
  # of the app, which is why it is here and not above.
  image: ^4.3.0

  # The floor the analyser stands on. `analysis_options.yaml` adds to it, and
  # explains what each addition is doing there; `make analyze` runs the lot
  # with infos and warnings fatal.
  flutter_lints: ^5.0.0

flutter:
  # The Material icon font, which the chrome draws every icon from — the app
  # menu's entries, the menu a profile gives you, the scanner's torch.
  #
  # There is no `assets:` section, on purpose. `assets/rollhippo.svg` is the
  # mark as drawn and the drawing of record, but nothing loads it at runtime:
  # `tool/app_icon.dart` transcribes it into the platforms' own icon
  # catalogues, and those are what ship. See CLAUDE.md.
  uses-material-design: true
